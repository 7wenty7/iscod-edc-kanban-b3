services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/visiplus
      JWT_SECRET: ${JWT_SECRET} # pris dans le fichier .env
    depends_on:
      - mongo

volumes:
  mongo_data:
